# ==================== Server Configuration ====================
server.port=8090
server.name=log_query_server

# ==================== Nacos Configuration ====================
# Nacos server address (required)
# Example: nacos:80 or 127.0.0.1:8848
#nacos.config.addrs=${nacos_config_addrs:127.0.0.1:8848}
#nacos.config.data.id=log_query_config
#nacos.config.group=DEFAULT_GROUP

# ==================== Default Storage Configuration ====================
# Default storage type: elasticsearch, doris, mysql
log.query.default.storage=mysql

# ==================== MySQL Configuration (Default) ====================
# MySQL connection settings
mysql.log.addr=${mysql.log.addr}
mysql.log.database=${mysql.log.database}
mysql.log.user=${mysql.log.user}
mysql.log.pwd=${mysql.log.pwd}
mysql.log.pool.size=10

# Log table name pattern (supports date suffix like log_data_20240101)
mysql.log.table.pattern=log_data

# ==================== Elasticsearch Configuration ====================
# ES cluster configuration (optional, for ES storage)
es.default.cluster.id=1
es.addr=
es.user=
es.pwd=

# ==================== Doris Configuration ====================
# Doris connection settings (optional, for Doris storage)
doris.addr=
doris.database=hera_log
doris.user=
doris.pwd=

# ==================== Query Settings ====================
# Maximum time range for queries (milliseconds, default 7 days)
log.query.max.time.range=604800000
# Default page size
log.query.default.page.size=100
# Maximum page size
log.query.max.page.size=10000
# Query timeout (milliseconds)
log.query.timeout=30000

# ==================== Logging ====================
log.path=/home/work/log/log-query
